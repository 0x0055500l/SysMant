<header class="navbar topbar">
  <div class="d-flex align-items-center gap-3 min-width-0">
    <button type="button" class="btn icon-button menu-button" aria-label="Abrir menú de navegación"
      aria-haspopup="dialog" aria-controls="mobile-navigation" (click)="menuToggle.emit()">
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <div class="workspace-label"><i class="bi bi-buildings" aria-hidden="true"></i><span>Estación de servicio <span class="station-brand">Puma Energy</span></span></div>
  </div>
  <div class="account">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <div class="account-text"><span class="user-name">{{ auth.currentUser()?.nombre }}</span><span class="user-role">{{ auth.roleLabel() }}</span></div>
    <span class="account-divider" aria-hidden="true"></span>
    <button type="button" class="btn logout-button" (click)="auth.logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Cerrar sesión</span>
    </button>
  </div>
</header>
